version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: archazor_postgres
    restart: always
    environment:
      POSTGRES_DB: archazor_db
      POSTGRES_USER: archazor_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ArchazorDbPassword2026!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archazor_user -d archazor_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archazor_backend
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=archazor_db;Username=archazor_user;Password=${POSTGRES_PASSWORD:-ArchazorDbPassword2026!}"
      AllowedOrigins: "http://localhost:3000,https://archazor.uz"
      AdminSeed__Username: "admin@archazor.uz"
      AdminSeed__Password: "${ADMIN_PASSWORD:-ArchazorAdmin2026!}"
    ports:
      - "5144:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: archazor_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:5144/api"
      NEXT_PUBLIC_SITE_URL: "https://archazor.uz"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
